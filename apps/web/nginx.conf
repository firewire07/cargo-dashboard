# Docker's embedded DNS refreshes the upstream after gateway container recreation.
# Open-source Nginx >= 1.27.3 supports upstream resolve + shared zones.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
upstream cargo_gateway {
    zone cargo_gateway 64k;
    server gateway:3000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness only: not proof that the API or database is ready.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/$is_args$args;
    }
    location ^~ /api/ {
        # Trailing slash strips /api/: /api/flights -> /flights (query preserved).
        proxy_pass http://cargo_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_next_upstream off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Only content-hashed Angular JS/CSS gets immutable caching.
    location ~* "-[a-z0-9]{8,}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Missing static assets must not return an HTML SPA document.
    location ~* \.(js|css|map|json|ico|png|jpe?g|gif|svg|webp|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
